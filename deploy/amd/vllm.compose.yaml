services:
  inference:
    image: ${VLLM_IMAGE:?Set a pinned vllm/vllm-openai-rocm image}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    shm_size: 8gb
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${MODEL_ID:?Set an authorized model repository or container path}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-ecsneo-model}
      - --api-key
      - ${INFERENCE_API_KEY:?Set an independent inference key}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${CONTEXT_SIZE:-8192}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-1}
volumes:
  model-cache:
